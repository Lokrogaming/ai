<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot - 🤖 Intelligenter Assistent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6C63FF;
      --secondary: #FF6B6B;
      --accent: #4ECDC4;
      --dark: #2D3436;
      --light: #F5F6FA;
      --text: #333333;
      --success: #26A65B;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 800px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid var(--primary);
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 15px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      text-align: right;
    }

    .message-content {
      display: inline-block;
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .user .message-content {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 0;
    }

    .bot .message-content {
      background: #e9ecef;
      color: var(--text);
      border-bottom-left-radius: 0;
    }

    .input-area {
      padding: 15px 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    #messageInput:focus {
      border-color: var(--primary);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(108, 99, 255, 0.4);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .clear-btn {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }

    .clear-btn:hover {
      opacity: 0.9;
    }

    .timestamp {
      font-size: 11px;
      color: #999;
      margin-top: 5px;
    }

    .welcome-message {
      text-align: center;
      color: #999;
      padding: 40px 20px;
      font-size: 16px;
    }

    .command-hint {
      background: #e3f2fd;
      border-left: 4px solid var(--primary);
      padding: 10px 15px;
      margin: 10px 0;
      border-radius: 4px;
      font-size: 12px;
      color: #1565c0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 AI Chatbot</h1>
      <p>Dein intelligenter digitaler Assistent</p>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Schreib eine Nachricht oder einen Befehl..." />
      <button class="send-btn" id="sendBtn">Senden</button>
      <button class="clear-btn" id="clearBtn">Löschen</button>
    </div>
  </div>

  <script>
    class AICharacteristics {
      constructor() {
        this.rules = {
          friendly: true,
          noDataSelling: true,
          noDataStealing: true,
          preventHarm: true
        };
      }

      validateResponse(response) {
        if (response.toLowerCase().includes('illegalen') || 
            response.toLowerCase().includes('schaden')) {
          return false;
        }
        return true;
      }
    }

    class ChatBot {
      constructor() {
        this.characteristics = new AICharacteristics();
        this.conversationHistory = [];
        this.loadHistory();
        this.responses = {
          greetings: [
            'Hallo! Ich bin dein KI-Assistent. Wie kann ich dir heute helfen?',
            'Willkommen! Ich bin bereit, dir zu helfen. Was möchtest du wissen?',
            'Hallo! Schön, dich zu treffen. Womit kann ich dir helfen?'
          ],
          farewells: [
            'Auf Wiedersehen! Bis bald! 👋',
            'Tschüss! Hab einen schönen Tag! ✌️',
            'Bis dann! Jederzeit gerne wieder da! 😊'
          ],
          default: [
            'Das ist interessant! Kannst du mehr darüber erzählen?',
            'Ich verstehe. Wie kann ich dir dabei helfen?',
            'Sehr interessant! Was möchtest du noch wissen?'
          ]
        };
      }

      loadHistory() {
        const saved = localStorage.getItem('chatHistory');
        if (saved) {
          this.conversationHistory = JSON.parse(saved);
        }
      }

      saveHistory() {
        localStorage.setItem('chatHistory', JSON.stringify(this.conversationHistory));
      }

      processMessage(userMessage) {
        this.conversationHistory.push({
          type: 'user',
          message: userMessage,
          timestamp: new Date()
        });

        let response = '';
        const msg = userMessage.toLowerCase();

        if (msg.includes('hallo') || msg.includes('hi')) {
          response = this.responses.greetings[Math.floor(Math.random() * this.responses.greetings.length)];
        } else if (msg.includes('auf wiedersehen') || msg.includes('tschüss')) {
          response = this.responses.farewells[Math.floor(Math.random() * this.responses.farewells.length)];
        } else if (msg.includes('search:')) {
          const query = msg.replace('search:', '').trim();
          response = `Ich suche nach Informationen zu: "${query}"...\n✅ Diese Funktion würde eine API-Integration benötigen.`;
        } else if (msg.includes('product:')) {
          const product = msg.replace('product:', '').trim();
          response = `Ich suche nach Produkten wie: "${product}"...\n✅ Diese Funktion würde eine API-Integration benötigen.`;
        } else if (msg.includes('clear') || msg === 'löschen') {
          this.conversationHistory = [];
          this.saveHistory();
          response = 'Gespr¨achsverlauf gelöscht! 🗑️';
        } else if (msg.includes('hilfe')) {
          response = 'Verfügbare Befehle:\n• search: [Thema] - Sucht Informationen\n• product: [Name] - Findet Produkte\n• clear - Löscht den Chat\n• Normale Fragen beantworten';
        } else {
          response = this.responses.default[Math.floor(Math.random() * this.responses.default.length)];
          response += `\n\nDu hast gesagt: "${userMessage}"\nIch lerne immer mehr über verschiedene Themen!`;
        }

        this.conversationHistory.push({
          type: 'bot',
          message: response,
          timestamp: new Date()
        });

        this.saveHistory();
        return response;
      }
    }

    const chatBot = new ChatBot();

    function renderMessages() {
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = '';

      if (chatBot.conversationHistory.length === 0) {
        chatArea.innerHTML = `
          <div class="welcome-message">
            <h2>Willkommen! 👋</h2>
            <p>Ich bin dein KI-Assistent. Schreib einfach eine Nachricht, um zu beginnen!</p>
            <div class="command-hint">
              💡 Tipp: Versuche "search: [Thema]" oder "product: [Name]" für spezielle Aufgaben
            </div>
          </div>
        `;
        return;
      }

      chatBot.conversationHistory.forEach(msg => {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${msg.type}`;
        const time = new Date(msg.timestamp).toLocaleTimeString('de-DE', { 
          hour: '2-digit', 
          minute: '2-digit' 
        });
        messageDiv.innerHTML = `
          <div class="message-content">${escapeHtml(msg.message)}</div>
          <div class="timestamp">${time}</div>
        `;
        chatArea.appendChild(messageDiv);
      });

      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();

      if (message === '') return;

      const response = chatBot.processMessage(message);
      input.value = '';
      renderMessages();
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Soll der Gespr¨achsverlauf wirklich gelöscht werden?')) {
        chatBot.conversationHistory = [];
        chatBot.saveHistory();
        renderMessages();
      }
    });

    renderMessages();
  </script>
</body>
</html>
