<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot - 🤖 Intelligenter Assistent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6C63FF;
      --secondary: #FF6B6B;
      --accent: #4ECDC4;
      --dark: #2D3436;
      --light: #F5F6FA;
      --text: #333333;
      --success: #26A65B;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 800px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid var(--primary);
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 15px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      text-align: right;
    }

    .message-content {
      display: inline-block;
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 15px;
      word-wrap: break-word;
      line-height: 1.5;
    }

    .user .message-content {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 0;
    }

    .bot .message-content {
      background: #e9ecef;
      color: var(--text);
      border-bottom-left-radius: 0;
    }

    .bot .message-content strong {
      color: var(--primary);
    }

    .bot .message-content em {
      color: var(--secondary);
    }

    .input-area {
      padding: 15px 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    #messageInput:focus {
      border-color: var(--primary);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(108, 99, 255, 0.4);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .clear-btn {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }

    .clear-btn:hover {
      opacity: 0.9;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 10px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
      30% { transform: translateY(-10px); opacity: 1; }
    }

    .timestamp {
      font-size: 11px;
      color: #999;
      margin-top: 5px;
    }

    .welcome-message {
      text-align: center;
      color: #999;
      padding: 40px 20px;
      font-size: 16px;
    }

    .command-hint {
      background: #e3f2fd;
      border-left: 4px solid var(--primary);
      padding: 10px 15px;
      margin: 10px 0;
      border-radius: 4px;
      font-size: 12px;
      color: #1565c0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 AI Chatbot</h1>
      <p>Dein intelligenter digitaler Assistent mit dynamischen Antworten</p>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Schreib eine Frage oder ein Thema..." />
      <button class="send-btn" id="sendBtn">Senden</button>
      <button class="clear-btn" id="clearBtn">Löschen</button>
    </div>
  </div>
